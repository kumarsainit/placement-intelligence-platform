spring:
    datasource:
        url: jdbc:h2:mem:placement_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password: ''

    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect

    flyway:
        enabled: false

jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1wbGFjZW1lbnQtaW50ZWxsaWdlbmNlLXBsYXRmb3JtLXRlc3RpbmctMTIzNDU=
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000

app:
    file-storage:
        resume-directory: target/test-uploads/resumes
