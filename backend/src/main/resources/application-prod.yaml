server:
    port: ${SERVER_PORT:8080}
    servlet:
        context-path: /api

spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: validate

        show-sql: false

        properties:
            hibernate:
                format_sql: false

    flyway:
        enabled: true
        locations: classpath:db/migration

logging:
    level:
        root: INFO
