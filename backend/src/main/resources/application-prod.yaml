server:
    port: ${SERVER_PORT:8080}
    servlet:
        context-path: /api

spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 10MB

    jpa:
        hibernate:
            ddl-auto: validate

        show-sql: false

        properties:
            hibernate:
                format_sql: false

    flyway:
        enabled: true
        locations: classpath:db/migration

logging:
    level:
        root: INFO

jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app:
    otp:
        expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
    file-storage:
        resume-directory: ${RESUME_STORAGE_DIR:uploads/resumes}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:https://placement.example.com}
