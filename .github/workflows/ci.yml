name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run Backend Tests
        working-directory: backend
        run: mvn clean test

      - name: Package Backend JAR
        working-directory: backend
        run: mvn package -DskipTests

  frontend:
    name: Frontend (Node 20 / Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Codebase
        working-directory: frontend
        run: npm run lint

      - name: Typecheck TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
        run: npm run build -- --webpack

  docker:
    name: Docker Container Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.prod.yml config

      - name: Build Backend Docker Image
        run: docker build -t placement-intelligence-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://example.invalid/api \
            -t placement-intelligence-frontend:ci ./frontend
